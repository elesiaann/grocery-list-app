<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshCart — Shared Grocery List</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🛒</text></svg>">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --green:      #22c55e;
            --green-dark: #16a34a;
            --green-soft: #dcfce7;
            --red:        #ef4444;
            --red-soft:   #fee2e2;
            --gray-50:    #f9fafb;
            --gray-100:   #f3f4f6;
            --gray-200:   #e5e7eb;
            --gray-400:   #9ca3af;
            --gray-600:   #4b5563;
            --gray-900:   #111827;
            --white:      #ffffff;
            --shadow:     0 2px 12px rgba(0,0,0,0.08);
            --shadow-md:  0 4px 24px rgba(0,0,0,0.12);
            --radius:     12px;
            --transition: all 0.25s ease;
        }
        html, body { height: 100%; overflow-x: hidden; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 50%, #f0fdf4 100%);
            min-height: 100vh;
            color: var(--gray-900);
        }

        /* ── HEADER ── */
        header {
            background: var(--green-dark);
            padding: 0 20px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 12px rgba(22,163,74,0.3);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            color: white;
        }
        .logo span { font-size: 1.5rem; }
        .logo h1 { font-size: 1.2rem; font-weight: 700; }
        .logo small { font-size: 0.65rem; color: rgba(255,255,255,0.75); display: block; margin-top: -2px; font-weight: 400; }

        .header-actions { display: flex; gap: 10px; }
        .btn-icon {
            width: 38px; height: 38px;
            border-radius: 9px;
            border: none;
            background: rgba(255,255,255,0.15);
            color: white;
            font-size: 15px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: var(--transition);
            position: relative;
        }
        .btn-icon:hover { background: rgba(255,255,255,0.25); }

        /* Live sync badge */
        .sync-badge {
            position: absolute;
            top: -4px; right: -4px;
            width: 10px; height: 10px;
            border-radius: 50%;
            background: #4ade80;
            border: 2px solid var(--green-dark);
            animation: syncPulse 2s ease-in-out infinite;
        }
        @keyframes syncPulse {
            0%,100% { opacity:1; transform:scale(1); }
            50%      { opacity:0.6; transform:scale(0.85); }
        }

        /* ── MAIN LAYOUT ── */
        main {
            max-width: 640px;
            margin: 0 auto;
            padding: 24px 16px 100px;
        }

        /* ── ADD ITEM CARD ── */
        .add-card {
            background: var(--white);
            border-radius: 18px;
            padding: 20px;
            box-shadow: var(--shadow-md);
            margin-bottom: 20px;
        }
        .add-card h2 {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--green-dark);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 14px;
        }
        .input-row {
            display: grid;
            grid-template-columns: 1fr 80px;
            gap: 10px;
            margin-bottom: 10px;
        }
        .input-row-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 14px;
        }
        .field input, .field select {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid var(--gray-200);
            border-radius: 10px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.9rem;
            color: var(--gray-900);
            background: var(--gray-50);
            outline: none;
            transition: var(--transition);
        }
        .field input:focus, .field select:focus {
            border-color: var(--green);
            background: white;
            box-shadow: 0 0 0 3px rgba(34,197,94,0.12);
        }
        .field label {
            display: block;
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--gray-600);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }
        .btn-add {
            width: 100%;
            background: linear-gradient(135deg, var(--green-dark), var(--green));
            color: white;
            border: none;
            padding: 13px;
            border-radius: 10px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: var(--transition);
        }
        .btn-add:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(34,197,94,0.4); }
        .btn-add:active { transform: translateY(0); }

        /* ── STATS BAR ── */
        .stats-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }
        .stat-pill {
            flex: 1;
            background: white;
            border-radius: 10px;
            padding: 10px 14px;
            text-align: center;
            box-shadow: var(--shadow);
        }
        .stat-pill .num { font-size: 1.4rem; font-weight: 800; color: var(--green-dark); line-height: 1; }
        .stat-pill .lbl { font-size: 0.7rem; color: var(--gray-400); font-weight: 500; }

        /* ── FILTER TABS ── */
        .filter-row {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none;
        }
        .filter-row::-webkit-scrollbar { display: none; }
        .filter-btn {
            padding: 7px 16px;
            border-radius: 50px;
            border: 1.5px solid var(--gray-200);
            background: white;
            font-family: 'Poppins', sans-serif;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--gray-600);
            cursor: pointer;
            white-space: nowrap;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .filter-btn:hover { border-color: var(--green); color: var(--green-dark); }
        .filter-btn.active {
            background: var(--green-dark);
            border-color: var(--green-dark);
            color: white;
        }

        /* ── SORT ROW ── */
        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        .toolbar-left { font-size: 0.82rem; color: var(--gray-600); font-weight: 500; }
        .sort-btn {
            background: white;
            border: 1.5px solid var(--gray-200);
            border-radius: 8px;
            padding: 6px 12px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.76rem;
            font-weight: 600;
            color: var(--gray-600);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: var(--transition);
        }
        .sort-btn:hover { border-color: var(--green); color: var(--green-dark); }

        /* ── ITEM LIST ── */
        .items-list { display: flex; flex-direction: column; gap: 10px; }

        .category-group { }
        .category-label {
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--gray-400);
            padding: 4px 4px 8px;
            display: flex;
            align-items: center;
            gap: 7px;
        }
        .category-label::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--gray-200);
        }

        .item-card {
            background: white;
            border-radius: var(--radius);
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: var(--shadow);
            border: 1.5px solid transparent;
            transition: var(--transition);
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { opacity:0; transform:translateY(-10px); }
            to   { opacity:1; transform:translateY(0); }
        }
        .item-card:hover { border-color: var(--gray-200); box-shadow: var(--shadow-md); }
        .item-card.checked { opacity: 0.55; }
        .item-card.checked .item-name { text-decoration: line-through; color: var(--gray-400); }

        .item-check {
            width: 22px; height: 22px;
            border-radius: 50%;
            border: 2px solid var(--gray-200);
            cursor: pointer;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            background: transparent;
        }
        .item-check.done { background: var(--green); border-color: var(--green); }
        .item-check.done::after { content: '✓'; color: white; font-size: 12px; font-weight: 700; }

        .cat-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .item-body { flex: 1; min-width: 0; }
        .item-name { font-size: 0.95rem; font-weight: 600; color: var(--gray-900); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .item-meta { font-size: 0.75rem; color: var(--gray-400); margin-top: 2px; display: flex; align-items: center; gap: 8px; }

        .item-qty {
            background: var(--gray-100);
            border-radius: 6px;
            padding: 4px 10px;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--gray-600);
            flex-shrink: 0;
        }

        .item-del {
            width: 30px; height: 30px;
            border-radius: 8px;
            border: none;
            background: transparent;
            color: var(--gray-400);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            transition: var(--transition);
            flex-shrink: 0;
        }
        .item-del:hover { background: var(--red-soft); color: var(--red); }

        /* ── EMPTY STATE ── */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--gray-400);
        }
        .empty-state .icon { font-size: 4rem; margin-bottom: 16px; }
        .empty-state h3 { font-size: 1.1rem; font-weight: 700; color: var(--gray-600); margin-bottom: 8px; }
        .empty-state p { font-size: 0.88rem; line-height: 1.7; }

        /* ── CLEAR COMPLETED ── */
        .clear-btn {
            width: 100%;
            margin-top: 16px;
            padding: 12px;
            background: var(--red-soft);
            color: var(--red);
            border: 1.5px solid #fecaca;
            border-radius: 10px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: var(--transition);
        }
        .clear-btn:hover { background: var(--red); color: white; border-color: var(--red); }

        /* ── TOAST ── */
        #toast {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--gray-900);
            color: white;
            padding: 11px 22px;
            border-radius: 50px;
            font-size: 0.86rem;
            font-weight: 500;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 9999;
            white-space: nowrap;
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* ── SHARE MODAL ── */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 500;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-overlay.open { display: flex; }
        .modal {
            background: white;
            border-radius: 20px;
            padding: 28px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }
        .modal h3 { font-size: 1.1rem; font-weight: 700; color: var(--gray-900); margin-bottom: 6px; }
        .modal p { font-size: 0.85rem; color: var(--gray-600); margin-bottom: 18px; line-height: 1.6; }
        .share-url {
            background: var(--gray-50);
            border: 1.5px solid var(--gray-200);
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 0.82rem;
            color: var(--gray-600);
            word-break: break-all;
            margin-bottom: 14px;
            line-height: 1.6;
            min-height: 48px;
        }
        .modal-btns { display: flex; gap: 10px; }
        .btn-copy {
            flex: 1;
            background: var(--green-dark);
            color: white;
            border: none;
            padding: 11px;
            border-radius: 10px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.88rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
        }
        .btn-copy:hover { background: var(--green); }
        .btn-close-modal {
            padding: 11px 18px;
            border-radius: 10px;
            border: 1.5px solid var(--gray-200);
            background: white;
            font-family: 'Poppins', sans-serif;
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--gray-600);
            cursor: pointer;
            transition: var(--transition);
        }
        .btn-close-modal:hover { border-color: var(--gray-400); }

        /* ── SYNC INDICATOR ── */
        .sync-bar {
            background: var(--green-dark);
            color: white;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 6px 16px;
            text-align: center;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 7px;
        }
        .sync-bar.show { display: flex; }

        /* ── CATEGORY COLORS ── */
        .cat-produce   { background: #22c55e; }
        .cat-dairy     { background: #3b82f6; }
        .cat-meat      { background: #ef4444; }
        .cat-bakery    { background: #f59e0b; }
        .cat-frozen    { background: #06b6d4; }
        .cat-snacks    { background: #a855f7; }
        .cat-beverages { background: #f97316; }
        .cat-other     { background: #6b7280; }

        /* ── RESPONSIVE ── */
        @media (max-width: 480px) {
            main { padding: 16px 12px 90px; }
            .input-row-2 { grid-template-columns: 1fr; }
            .stats-bar { gap: 7px; }
            .stat-pill .num { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

<!-- ── SYNC BAR ── -->
<div class="sync-bar" id="syncBar">
    <i class="fas fa-sync-alt fa-spin" style="font-size:11px"></i>
    List updated from another tab
</div>

<!-- ── HEADER ── -->
<header>
    <div class="logo">
        <span>🛒</span>
        <div>
            <h1>FreshCart</h1>
            <small>Shared Grocery List · Real-Time Sync</small>
        </div>
    </div>
    <div class="header-actions">
        <button class="btn-icon" onclick="openShare()" title="Share list">
            <i class="fas fa-share-nodes"></i>
        </button>
        <button class="btn-icon" onclick="clearAll()" title="Clear all items">
            <div class="sync-badge"></div>
            <i class="fas fa-wifi"></i>
        </button>
    </div>
</header>

<!-- ── MAIN ── -->
<main>

    <!-- Add Item Card -->
    <div class="add-card">
        <h2><i class="fas fa-plus-circle" style="color:var(--green);margin-right:5px"></i>Add Item</h2>
        <div class="input-row">
            <div class="field">
                <label>Item Name</label>
                <input type="text" id="itemName" placeholder="e.g. Organic Apples" autocomplete="off" maxlength="60">
            </div>
            <div class="field">
                <label>Qty</label>
                <input type="text" id="itemQty" placeholder="e.g. 2" maxlength="12">
            </div>
        </div>
        <div class="input-row-2">
            <div class="field">
                <label>Category</label>
                <select id="itemCat">
                    <option value="produce">🥦 Produce</option>
                    <option value="dairy">🥛 Dairy</option>
                    <option value="meat">🥩 Meat</option>
                    <option value="bakery">🍞 Bakery</option>
                    <option value="frozen">❄️ Frozen</option>
                    <option value="snacks">🍿 Snacks</option>
                    <option value="beverages">🧃 Beverages</option>
                    <option value="other">📦 Other</option>
                </select>
            </div>
            <div class="field">
                <label>Note (optional)</label>
                <input type="text" id="itemNote" placeholder="e.g. Organic, on sale" maxlength="40">
            </div>
        </div>
        <button class="btn-add" onclick="addItem()">
            <i class="fas fa-cart-plus"></i> Add to List
        </button>
    </div>

    <!-- Stats -->
    <div class="stats-bar">
        <div class="stat-pill"><div class="num" id="statTotal">0</div><div class="lbl">Total</div></div>
        <div class="stat-pill"><div class="num" id="statLeft">0</div><div class="lbl">Remaining</div></div>
        <div class="stat-pill"><div class="num" id="statDone">0</div><div class="lbl">Got It ✓</div></div>
    </div>

    <!-- Filter Tabs -->
    <div class="filter-row" id="filterRow">
        <button class="filter-btn active" data-filter="all" onclick="setFilter('all',this)">
            <i class="fas fa-list"></i> All
        </button>
        <button class="filter-btn" data-filter="active" onclick="setFilter('active',this)">
            <i class="fas fa-circle"></i> Remaining
        </button>
        <button class="filter-btn" data-filter="done" onclick="setFilter('done',this)">
            <i class="fas fa-check-circle"></i> Got It
        </button>
        <button class="filter-btn" data-filter="produce" onclick="setFilter('produce',this)">🥦 Produce</button>
        <button class="filter-btn" data-filter="dairy" onclick="setFilter('dairy',this)">🥛 Dairy</button>
        <button class="filter-btn" data-filter="meat" onclick="setFilter('meat',this)">🥩 Meat</button>
        <button class="filter-btn" data-filter="bakery" onclick="setFilter('bakery',this)">🍞 Bakery</button>
        <button class="filter-btn" data-filter="frozen" onclick="setFilter('frozen',this)">❄️ Frozen</button>
        <button class="filter-btn" data-filter="snacks" onclick="setFilter('snacks',this)">🍿 Snacks</button>
        <button class="filter-btn" data-filter="beverages" onclick="setFilter('beverages',this)">🧃 Beverages</button>
        <button class="filter-btn" data-filter="other" onclick="setFilter('other',this)">📦 Other</button>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
        <span class="toolbar-left" id="toolbarLabel">All items</span>
        <button class="sort-btn" onclick="toggleSort()">
            <i class="fas fa-sort-alpha-down" id="sortIcon"></i>
            <span id="sortLabel">Sort: Category</span>
        </button>
    </div>

    <!-- Items List -->
    <div class="items-list" id="itemsList"></div>

    <!-- Clear Completed -->
    <button class="clear-btn" id="clearBtn" onclick="clearCompleted()" style="display:none">
        <i class="fas fa-trash-alt"></i> Clear Completed (<span id="doneCount">0</span>)
    </button>

</main>

<!-- ── SHARE MODAL ── -->
<div class="modal-overlay" id="shareModal">
    <div class="modal">
        <h3>📤 Share Your List</h3>
        <p>Copy this link and open it on any device or browser. Your list will be synced in real time between all open tabs.</p>
        <div class="share-url" id="shareUrl">Generating link...</div>
        <div class="modal-btns">
            <button class="btn-copy" onclick="copyShareUrl()"><i class="fas fa-copy"></i> Copy Link</button>
            <button class="btn-close-modal" onclick="closeShare()">Close</button>
        </div>
    </div>
</div>

<!-- ── TOAST ── -->
<div id="toast"></div>

<script>
/* ================================================================
   STATE
================================================================ */
let items  = [];
let filter = 'all';
let sortBy = 'category'; // 'category' | 'name' | 'added'

const STORAGE_KEY = (() => {
    const params = new URLSearchParams(window.location.search);
    return 'freshcart_' + (params.get('list') || 'default');
})();

const CAT_EMOJI = {
    produce:   '🥦', dairy: '🥛', meat: '🥩', bakery: '🍞',
    frozen:    '❄️', snacks: '🍿', beverages: '🧃', other: '📦'
};

const CAT_ORDER = ['produce','dairy','meat','bakery','frozen','snacks','beverages','other'];

/* ================================================================
   STORAGE + REAL-TIME SYNC (BroadcastChannel)
================================================================ */
const bc = ('BroadcastChannel' in window) ? new BroadcastChannel(STORAGE_KEY) : null;

function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    if (bc) bc.postMessage({ type: 'sync', items });
}

function load() {
    try {
        const data = localStorage.getItem(STORAGE_KEY);
        items = data ? JSON.parse(data) : [];
    } catch { items = []; }
}

// Listen for real-time updates from other tabs
if (bc) {
    bc.onmessage = (e) => {
        if (e.data && e.data.type === 'sync') {
            items = e.data.items;
            render();
            flashSyncBar();
        }
    };
}

function flashSyncBar() {
    const bar = document.getElementById('syncBar');
    bar.classList.add('show');
    setTimeout(() => bar.classList.remove('show'), 2500);
}

/* ================================================================
   CRUD
================================================================ */
function addItem() {
    const name = document.getElementById('itemName').value.trim();
    if (!name) {
        document.getElementById('itemName').focus();
        showToast('Please enter an item name');
        return;
    }
    const item = {
        id:    Date.now().toString(36) + Math.random().toString(36).slice(2),
        name,
        qty:   document.getElementById('itemQty').value.trim() || '1',
        cat:   document.getElementById('itemCat').value,
        note:  document.getElementById('itemNote').value.trim(),
        done:  false,
        added: Date.now()
    };
    items.unshift(item);
    save();
    render();
    document.getElementById('itemName').value = '';
    document.getElementById('itemQty').value  = '';
    document.getElementById('itemNote').value = '';
    document.getElementById('itemName').focus();
    showToast(`${CAT_EMOJI[item.cat]} "${item.name}" added`);
}

function toggleItem(id) {
    const item = items.find(i => i.id === id);
    if (item) { item.done = !item.done; save(); render(); }
}

function deleteItem(id) {
    const item = items.find(i => i.id === id);
    items = items.filter(i => i.id !== id);
    save();
    render();
    if (item) showToast(`"${item.name}" removed`);
}

function clearCompleted() {
    const count = items.filter(i => i.done).length;
    if (!count) return;
    items = items.filter(i => !i.done);
    save();
    render();
    showToast(`${count} item${count > 1 ? 's' : ''} cleared`);
}

function clearAll() {
    if (!items.length) { showToast('List is already empty'); return; }
    if (!confirm(`Remove all ${items.length} items?`)) return;
    items = [];
    save();
    render();
    showToast('List cleared');
}

/* ================================================================
   FILTER & SORT
================================================================ */
function setFilter(f, btn) {
    filter = f;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
}

function toggleSort() {
    const order = ['category', 'name', 'added'];
    const labels = ['Category', 'Name A-Z', 'Date Added'];
    const icons  = ['fa-sort-alpha-down', 'fa-sort-alpha-down', 'fa-clock'];
    const idx = (order.indexOf(sortBy) + 1) % order.length;
    sortBy = order[idx];
    document.getElementById('sortLabel').textContent = 'Sort: ' + labels[idx];
    const icon = document.getElementById('sortIcon');
    icon.className = 'fas ' + icons[idx];
    render();
}

function getFiltered() {
    let list = [...items];
    if (filter === 'active')  list = list.filter(i => !i.done);
    else if (filter === 'done') list = list.filter(i => i.done);
    else if (CAT_ORDER.includes(filter)) list = list.filter(i => i.cat === filter);

    if (sortBy === 'category') {
        list.sort((a, b) => CAT_ORDER.indexOf(a.cat) - CAT_ORDER.indexOf(b.cat) || a.name.localeCompare(b.name));
    } else if (sortBy === 'name') {
        list.sort((a, b) => a.name.localeCompare(b.name));
    } else {
        list.sort((a, b) => b.added - a.added);
    }
    return list;
}

/* ================================================================
   RENDER
================================================================ */
function render() {
    const total = items.length;
    const done  = items.filter(i => i.done).length;
    const left  = total - done;

    document.getElementById('statTotal').textContent = total;
    document.getElementById('statLeft').textContent  = left;
    document.getElementById('statDone').textContent  = done;

    const clearBtn  = document.getElementById('clearBtn');
    const doneCount = document.getElementById('doneCount');
    if (done > 0) { clearBtn.style.display = 'flex'; doneCount.textContent = done; }
    else            clearBtn.style.display = 'none';

    const filtered = getFiltered();
    const list     = document.getElementById('itemsList');

    // Toolbar label
    const filterLabels = {
        all: 'All items', active: 'Remaining items', done: 'Completed items',
        produce: '🥦 Produce', dairy: '🥛 Dairy', meat: '🥩 Meat',
        bakery:  '🍞 Bakery',  frozen: '❄️ Frozen', snacks: '🍿 Snacks',
        beverages: '🧃 Beverages', other: '📦 Other'
    };
    document.getElementById('toolbarLabel').textContent =
        `${filtered.length} ${filterLabels[filter] || 'items'}`;

    if (!filtered.length) {
        list.innerHTML = `
            <div class="empty-state">
                <div class="icon">🛒</div>
                <h3>${total === 0 ? 'Your list is empty' : 'No items here'}</h3>
                <p>${total === 0
                    ? 'Add your first grocery item above to get started!'
                    : 'Try switching the filter to see other items.'}</p>
            </div>`;
        return;
    }

    // Group by category when sorting by category
    if (sortBy === 'category' && (filter === 'all' || filter === 'active' || filter === 'done')) {
        const groups = {};
        filtered.forEach(item => {
            if (!groups[item.cat]) groups[item.cat] = [];
            groups[item.cat].push(item);
        });
        list.innerHTML = CAT_ORDER
            .filter(c => groups[c])
            .map(c => `
                <div class="category-group">
                    <div class="category-label">${CAT_EMOJI[c]} ${c.charAt(0).toUpperCase()+c.slice(1)}</div>
                    ${groups[c].map(itemHTML).join('')}
                </div>`)
            .join('');
    } else {
        list.innerHTML = filtered.map(itemHTML).join('');
    }
}

function itemHTML(item) {
    return `
        <div class="item-card ${item.done ? 'checked' : ''}" id="card-${item.id}">
            <div class="item-check ${item.done ? 'done' : ''}" onclick="toggleItem('${item.id}')"></div>
            <span class="cat-dot cat-${item.cat}"></span>
            <div class="item-body">
                <div class="item-name">${escHtml(item.name)}</div>
                ${item.note ? `<div class="item-meta">${escHtml(item.note)}</div>` : ''}
            </div>
            <div class="item-qty">${escHtml(item.qty)}</div>
            <button class="item-del" onclick="deleteItem('${item.id}')" title="Remove">
                <i class="fas fa-times"></i>
            </button>
        </div>`;
}

function escHtml(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ================================================================
   SHARE
================================================================ */
function openShare() {
    const params = new URLSearchParams(window.location.search);
    let listId = params.get('list');
    if (!listId) {
        listId = Math.random().toString(36).slice(2, 9);
        const newUrl = `${window.location.origin}${window.location.pathname}?list=${listId}`;
        window.history.replaceState({}, '', newUrl);
        // migrate storage to new key
        const newKey = 'freshcart_' + listId;
        localStorage.setItem(newKey, JSON.stringify(items));
    }
    const shareLink = `${window.location.origin}${window.location.pathname}?list=${listId}`;
    document.getElementById('shareUrl').textContent = shareLink;
    document.getElementById('shareModal').classList.add('open');
}

function closeShare() {
    document.getElementById('shareModal').classList.remove('open');
}

function copyShareUrl() {
    const url = document.getElementById('shareUrl').textContent;
    navigator.clipboard.writeText(url).then(() => {
        showToast('Link copied! Open on any device 🎉');
        closeShare();
    }).catch(() => {
        // fallback
        const el = document.createElement('textarea');
        el.value = url;
        document.body.appendChild(el);
        el.select();
        document.execCommand('copy');
        document.body.removeChild(el);
        showToast('Link copied!');
        closeShare();
    });
}

/* ================================================================
   TOAST
================================================================ */
let toastTimer;
function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

/* ================================================================
   KEYBOARD SHORTCUT — Enter to add
================================================================ */
document.getElementById('itemName').addEventListener('keydown', e => {
    if (e.key === 'Enter') addItem();
});
document.getElementById('itemQty').addEventListener('keydown', e => {
    if (e.key === 'Enter') addItem();
});
document.getElementById('itemNote').addEventListener('keydown', e => {
    if (e.key === 'Enter') addItem();
});

/* ================================================================
   CLOSE MODAL ON OVERLAY CLICK
================================================================ */
document.getElementById('shareModal').addEventListener('click', function(e) {
    if (e.target === this) closeShare();
});

/* ================================================================
   INIT
================================================================ */
load();
render();
</script>
